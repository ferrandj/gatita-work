[package]
name = "gatita"
version = "1.0.0"
edition = "2024"
description = "Gatita: self-hosted course revision app (lessons, exercises, achievements, in-app PDF)."
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
